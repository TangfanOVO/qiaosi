<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>赴约窗台</title>
<style>
/* 竖屏 2.5D：下半屏是桌面（往里的 z 方向），上半屏是墙和窗（往上的 y 方向）；窗外是海和沙滩，两边垂着柳条 */
:root{
  --bg:#e6e3dd; --card:#fbfaf7; --ink:#2e3236; --sub:#6c7075; --line:#d9d6d0; --accent:#a8687c;
  --glass:rgba(251,250,247,.86);
  --e-out:cubic-bezier(.22,.61,.36,1);
  color-scheme:light;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#head{position:absolute;left:14px;top:calc(var(--sat) + 12px);display:flex;flex-direction:column;gap:2px;background:var(--glass);padding:7px 11px;border-radius:14px;pointer-events:none}
#head b{font-size:15px;font-weight:700;letter-spacing:.04em}
#head span{font-size:10.5px;letter-spacing:.14em;color:var(--sub)}
#labs{position:absolute;inset:0;pointer-events:none;transition:opacity .35s var(--e-out)}
#labs.off{opacity:0}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;will-change:transform;transition:opacity .3s var(--e-out),visibility 0s}
.tag .p{display:flex;align-items:baseline;gap:5px;background:var(--glass);border-radius:10px;padding:3px 8px 4px;white-space:nowrap;box-shadow:0 2px 8px rgba(30,32,36,.08)}
.tag b{font-size:12px;font-weight:700}
.tag span{font-size:10.5px;color:var(--sub)}
.tag i{width:5px;height:5px;border-radius:50%;background:var(--card);box-shadow:0 0 0 1.5px rgba(46,50,54,.55)}
.tag.hide{opacity:0;visibility:hidden;transition:opacity .3s var(--e-out),visibility 0s .3s}
.tag.ping .p{box-shadow:0 0 0 2px var(--accent),0 2px 8px rgba(30,32,36,.12)}
#ctl{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 14px);display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
#ctl button{min-height:40px;padding:0 14px;border:0;border-radius:20px;background:var(--glass);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;box-shadow:0 2px 10px rgba(30,32,36,.08);font-variant-numeric:tabular-nums}
#ctl button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#ctl #cView{color:var(--accent);font-weight:700}
#wxp{order:-1;flex-basis:100%;max-width:440px;margin:0 auto;display:none;grid-template-columns:auto 1fr 2.4em auto 1fr 2.4em;align-items:center;gap:0 8px;padding:6px 14px 4px;border-radius:22px;font-size:12.5px}
#wxp.on{display:grid}
#ctl #wxp .tog{grid-column:1/-1;color:#fffdf9;text-shadow:inherit;box-shadow:none;justify-self:start;min-height:30px;margin:4px 0 2px;padding:0 12px;border:0;border-radius:15px;background:rgba(255,255,255,.14);font:inherit;font-size:12px;cursor:pointer}
#ctl #wxp .tog[aria-pressed=true]{background:rgba(168,104,124,.78)}
#wxp label{font-size:12px;letter-spacing:.04em;opacity:.92}
#wxp label:nth-of-type(even){margin-left:12px}
#wxp output{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px}
#wxp input{-webkit-appearance:none;appearance:none;width:100%;min-width:0;height:34px;margin:0;background:transparent;cursor:pointer;touch-action:pan-x}
#wxp input:focus-visible{outline:none}
#wxp input::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,rgba(255,253,249,.95) var(--p,0%),rgba(255,255,255,.26) var(--p,0%));box-shadow:0 0 2px rgba(20,16,12,.45)}
#wxp input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8.5px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(20,16,12,.45),0 0 0 .5px rgba(20,16,12,.2)}
#wxp input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px var(--accent),0 1px 4px rgba(20,16,12,.4)}
#wxp input::-moz-range-track{height:3px;border-radius:2px;background:rgba(255,255,255,.26)}
#wxp input::-moz-range-progress{height:3px;border-radius:2px;background:rgba(255,253,249,.95)}
#wxp input::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(20,16,12,.45)}
/* 液态玻璃：这些块本身不铺底色，玻璃是在画面里算出来的（背后的东西被弯一弯、磨一磨、边上一圈亮线）；字用白字加一圈深色的晕，亮处暗处都看得清 */
.tag .p,#head,body:not(.framed) #ctl > button,body:not(.framed) #wxp,#back,#hint{background:transparent!important;box-shadow:none!important;color:#fffdf9!important;text-shadow:0 0 1px rgba(22,18,14,.95),0 0 3px rgba(22,18,14,.65),0 1px 6px rgba(18,14,10,.45)}
#head span{color:#f1ebe2!important}
.tag .p{padding:4px 10px 5px}
.tag.ping .p{box-shadow:none!important}
.tag.ping b{color:#ffd9e4}
body:not(.framed) #ctl #cView{color:#ffe1ea!important}

#hint{position:absolute;left:50%;bottom:calc(var(--sab) + 118px);transform:translateX(-50%);white-space:nowrap;font-size:12.5px;background:var(--glass);padding:7px 13px;border-radius:999px;pointer-events:none;transition:opacity .6s var(--e-out)}
#hint.off{opacity:0}
#toast{position:absolute;left:50%;top:calc(var(--sat) + 66px);transform:translateX(-50%);background:rgba(46,50,54,.9);color:#fbfaf7;font-size:12.5px;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .24s var(--e-out);pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7}
#back{position:absolute;left:12px;top:calc(var(--sat) + 10px);min-height:44px;padding:0 14px 0 10px;border:0;border-radius:22px;background:var(--glass);color:var(--ink);font:inherit;font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .22s,transform .22s}
#back.on{opacity:1;transform:none;pointer-events:auto}
#card{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 12px);background:transparent;border-radius:24px;padding:16px 20px 12px;color:#fffdf9;text-shadow:0 0 1px rgba(22,18,14,.95),0 0 3px rgba(22,18,14,.7),0 1px 6px rgba(18,14,10,.5);transform:translateY(calc(100% + var(--sab) + 40px));visibility:hidden;transition:transform .24s cubic-bezier(.4,0,1,1),visibility 0s .24s}
#card.on{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.34,1.2,.64,1),visibility 0s}
#card .lab{font-size:10.5px;letter-spacing:.17em;color:#f6f1ea}
#card h2{margin:4px 0 2px;font-size:24px;font-weight:800;letter-spacing:.01em}
#card p{margin:0}
#k-sub{font-size:13px;color:#f3eee6}
#k-note{font-size:14px;line-height:1.7;margin-top:8px!important}
#card .go{margin-top:10px;min-height:44px;width:100%;border:0;border-top:1px solid rgba(255,255,255,.22);background:none;font:inherit;font-size:13.5px;color:#fffdf9;text-shadow:inherit;display:flex;align-items:center;justify-content:space-between;padding:0;cursor:pointer}
body.focused #ctl,body.focused #head{opacity:0;pointer-events:none}
#ctl,#head{transition:opacity .25s}
body.framed.focused #side #ctl{opacity:.35}
@media (prefers-reduced-motion:reduce){#labs,.tag,#hint,#toast,#card,#card.on,#back{transition:none}}
/* 电脑上预览：画面按 iPhone 17 Pro Max（440 × 956）画，整只“手机”等比放进窗口，按钮挪到手机外面 */
#island,#homebar,#side{display:none}
body.framed{background:#d9d6d0}
body.framed #app{inset:auto;left:0;top:0;width:440px;height:956px;transform-origin:0 0;border-radius:58px;
  box-shadow:0 0 0 11px #1b1a19,0 0 0 12.5px #4a4745,0 40px 90px rgba(40,30,20,.28);--sat:62px;--sab:30px}
body.framed #island{display:block;position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:18px;background:#0c0c0c;z-index:20;pointer-events:none}
body.framed #homebar{display:block;position:absolute;left:50%;bottom:8px;width:144px;height:5px;margin-left:-72px;border-radius:3px;background:rgba(40,34,30,.45);z-index:20;pointer-events:none}
body.framed #side{display:flex;position:fixed;flex-direction:column;gap:12px;width:320px}
body.framed #hint{bottom:calc(var(--sab) + 26px)}
#side #ctl{position:static;justify-content:flex-start}
#side #ctl button{background:var(--card)}
body.framed #cWx{display:none}
body.framed #wxp{display:grid;grid-template-columns:auto 1fr 3.2em;gap:0 12px;max-width:none;margin:0;padding:8px 18px;background:var(--card);box-shadow:0 2px 10px rgba(30,32,36,.08);color:var(--ink);font-size:13px}
body.framed #wxp label{margin-left:0;color:var(--sub);opacity:1}
body.framed #ctl #wxp .tog{color:var(--sub);background:rgba(46,50,54,.07);text-shadow:none}
body.framed #ctl #wxp .tog[aria-pressed=true]{background:var(--accent);color:#fff}
body.framed #wxp input::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--accent) var(--p,0%),rgba(46,50,54,.15) var(--p,0%));box-shadow:none}
body.framed #wxp input::-webkit-slider-thumb{box-shadow:0 1px 4px rgba(30,32,36,.28),0 0 0 .5px rgba(30,32,36,.18)}
body.framed #wxp input::-moz-range-track{background:rgba(46,50,54,.15)}
body.framed #wxp input::-moz-range-progress{background:var(--accent)}
</style>
</head>
<body>

<div id="app">
  <canvas id="c" aria-label="赴约窗台：一张桌子靠着窗，窗外是海，两边垂着柳条"></canvas>
  <div id="labs"></div>
  <div id="head"><b>赴约 · 窗台</b><span>草稿 · 演示数据</span></div>
  <div id="hint">左右拖转椅子 · 点东西凑近看 · 上滑看窗外</div>
  <div id="ctl" role="group" aria-label="草稿调节">
    <button id="cView" type="button">抬头看窗外 ↑</button>
    <div id="wxp" role="group" aria-label="季节和天气">
      <button id="cAuto" class="tog" type="button" aria-pressed="true">天色跟着现在的时间</button>
      <label for="sSeason">季节</label><input id="sSeason" type="range" min="0" max="3" step="1" value="0"><output for="sSeason"></output>
      <label for="sTod">天色</label><input id="sTod" type="range" min="0" max="2" step="1" value="0"><output for="sTod"></output>
      <label for="sWind">风</label><input id="sWind" type="range" min="0" max="100" step="1" value="25"><output for="sWind"></output>
      <label for="sRain">雨</label><input id="sRain" type="range" min="0" max="100" step="1" value="0"><output for="sRain"></output>
      <label for="sSnow">雪</label><input id="sSnow" type="range" min="0" max="100" step="1" value="0"><output for="sSnow"></output>
      <label for="sThun">雷</label><input id="sThun" type="range" min="0" max="100" step="1" value="0"><output for="sThun"></output>
    </div>
    <button id="cWx" type="button" aria-expanded="false" aria-controls="wxp">季节 · 天气</button>
    <button id="cLab" type="button" aria-pressed="true">标注 开</button>
  </div>
  <button id="back" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>退回</button>
  <section id="card" aria-live="polite">
    <span class="lab" id="k-lab"></span>
    <h2 id="k-title"></h2>
    <p id="k-sub"></p>
    <p id="k-note"></p>
    <button class="go" id="k-go" type="button"><span id="k-go-t"></span><span aria-hidden="true">›</span></button>
  </section>
  <div id="toast" role="status"></div>
  <div id="err">这台设备打不开 WebGL，画面出不来。</div>
  <div id="island"></div><div id="homebar"></div>
</div>
<aside id="side" aria-label="季节和天气"></aside>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* 单位：1 = 10 厘米。桌面在 y = 0，墙面在 z = -3.3，玻璃在 z = -4.85；窗外地面在 y = -37（二楼） */
const WALL_Z = -3.3, WALL_T = 1.8, GLASS_Z = -4.85;
const WIN = {x0: -.4, x1: 10.4, y0: 2.4, y1: 23};
const SILL_Y = 2.65, GROUND_Y = -37;

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let rnd = (a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(20261001);
const mkRng = seed => (a => () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(seed);   // 新加的东西用自己的随机数，不打乱别的摆件
const HAND_FONT = '"Kaiti SC","STKaiti","KaiTi","BiauKai","Xingkai SC","Noto Serif CJK SC","Noto Serif CJK TC",serif';
const UP = new THREE.Vector3(0, 1, 0);

/* ── 画面尺寸：手机上是整屏；电脑宽窗口里是一只 440 × 956 的“手机” ── */
const APP = document.getElementById('app'), SIDE = document.getElementById('side'), CTL = document.getElementById('ctl');
let framed = false, frameS = 1;
const VW = () => framed ? 440 : innerWidth, VH = () => framed ? 956 : innerHeight;
const layoutFrame = () => {
  const want = innerWidth / innerHeight > .8 && innerWidth >= 720;
  if (want !== framed){ framed = want; document.body.classList.toggle('framed', framed); (framed ? SIDE : APP).appendChild(CTL); }   // 电脑上：按钮和拉杆放在手机外面右边，一直摊开着，不挡画面
  if (!framed){ APP.style.transform = ''; return; }
  const sideW = 320, gap = 44, pad = 28;
  frameS = Math.min((innerHeight - pad * 2) / 956, (innerWidth - sideW - gap - pad * 2) / 440, 1.2);
  const pw = 440 * frameS, total = pw + gap + sideW, x0 = Math.max(pad, (innerWidth - total) / 2), y0 = (innerHeight - 956 * frameS) / 2;
  APP.style.transform = `translate(${x0}px, ${y0}px) scale(${frameS})`;
  SIDE.style.left = (x0 + pw + gap) + 'px'; SIDE.style.top = Math.max(pad, y0 + 120) + 'px';
};
layoutFrame();
const local = e => { if (!framed) return [e.clientX, e.clientY]; const r = APP.getBoundingClientRect(); return [(e.clientX - r.left) / frameS, (e.clientY - r.top) / frameS]; };

const canvas = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas, antialias: true, powerPreference: 'high-performance'}); }
catch (e){ document.getElementById('err').style.display = 'flex'; throw e; }
const DPR = Math.min(window.devicePixelRatio || 1, framed ? 2 : 1.6);
renderer.setPixelRatio(DPR);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, VW() / VH(), .3, 1200);
camera.layers.enable(1);          // 第 1 层：玻璃、雪 —— 画出来，但不进景深的深度图
const depthCam = camera.clone();

/* 环境反射：窗那边一大块亮的天光，脚下一点木头暖色 */
const pmrem = new THREE.PMREMGenerator(renderer);
{
  const env = new THREE.Scene(); env.background = new THREE.Color('#2a2a2a');
  const panel = (w, h, pos, col, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide})); m.position.copy(pos); m.lookAt(0, 0, 0); env.add(m); };
  panel(8, 12, new THREE.Vector3(0, 6, -10), '#e8f0f6', 4);
  panel(30, 30, new THREE.Vector3(0, 14, 0), '#ece8e1', .7);
  panel(30, 30, new THREE.Vector3(0, -9, 0), '#8a7458', .5);
  panel(12, 8, new THREE.Vector3(10, 4, 8), '#f3eee6', 1);
  scene.environment = pmrem.fromScene(env, .02).texture;
}

/* ── 材质 ── */
const std = (color, rough = .8, extra = {}) => new THREE.MeshStandardMaterial({color, roughness: rough, ...extra});
const M = {
  wall: std('#ece4d8', .95), sill: std('#4a4540', .55), desk: std('#a57e57', .5),
  steel: std('#231e1a', .6),
  glass: new THREE.MeshPhysicalMaterial({color: '#dfeaee', transparent: true, opacity: .1, roughness: .04, metalness: 0, depthWrite: false, side: THREE.DoubleSide, envMapIntensity: 1.4}),
  paper: std('#f4f1ea', .9, {side: THREE.DoubleSide}), bark: std('#a39d94', .78),
  ground: std('#a9b09a', 1), city: std('#c6cbcc', .95), concrete: std('#b9b8b2', .95)
};

/* ── 贴图：全部用代码现画（木纹、墙面、亚麻、书页、釉面），不用任何图片素材 ── */
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
const tex = (w, h, draw, {rep, color = true} = {}) => {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (color) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = ANISO;
  if (rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
};
const noiseDots = (x, w, h, n, a, cols) => { for (let i = 0; i < n; i++){ x.fillStyle = cols[(rnd() * cols.length) | 0].replace('A', (a * (.4 + rnd() * .6)).toFixed(3)); x.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2); } };
// 桌面木纹：顺着长边走的细纹 + 几条宽的深浅带
const woodDraw = (base, bandD, bandL, lineD, lineL) => (x, w, h) => {
  x.fillStyle = base; x.fillRect(0, 0, w, h);
  for (let b = 0; b < 14; b++){ const y = rnd() * h, hh = 20 + rnd() * 70; x.fillStyle = rnd() < .5 ? `rgba(${bandD},${.05 + rnd() * .08})` : `rgba(${bandL},${.05 + rnd() * .08})`; x.fillRect(0, y, w, hh); }
  for (let i = 0; i < 1100; i++){
    const y = rnd() * h, L = 300 + rnd() * 1500, x0 = rnd() * w - 300, dark = rnd() < .62;
    x.strokeStyle = dark ? `rgba(${lineD},${.05 + rnd() * .13})` : `rgba(${lineL},${.04 + rnd() * .09})`; x.lineWidth = .5 + rnd() * 1.8;
    x.beginPath(); x.moveTo(x0, y); const ph = rnd() * 6, amp = rnd() * 4; for (let k = 1; k <= 12; k++) x.lineTo(x0 + L * k / 12, y + Math.sin(k * .7 + ph) * amp); x.stroke();
  }
  noiseDots(x, w, h, 6000, .07, ['rgba(30,24,20,A)', 'rgba(200,190,175,A)']);   // 旧木头上的细小斑驳
};
// 桌面：烟熏过的旧橡木，偏灰褐；小件用一块浅一点的风化木
const woodTex = tex(2048, 680, woodDraw('#2c241e', '16,12,9', '74,62,50', '8,6,5', '96,82,68'));

const curtain = (() => {

    for (let y = 0; y < h; y += 2.6){ const a = .28 + cr() * .3; x.fillStyle = `rgba(255,255,255,${a})`; x.fillRect(0, y, w, cr() < .1 ? 1.9 : 1.1);
      for (let k = 0; k < 2; k++) if (cr() < .35){ x.fillStyle = `rgba(255,255,255,${.22 + cr() * .22})`; x.fillRect(cr() * w, y - .3, 6 + cr() * 18, 1.8); } }   // 纬线 + 竹节
    for (let xx = 0; xx < w; xx += 2.8){ x.fillStyle = `rgba(255,255,255,${.16 + cr() * .22})`; x.fillRect(xx, 0, cr() < .1 ? 1.8 : 1, h);
      if (cr() < .25){ x.fillStyle = `rgba(255,255,255,${.3 + cr() * .3})`; x.fillRect(xx - .3, cr() * h, 1.8, 10 + cr() * 50); } }

  const pleat = u => Math.sin(u * 21) * .7 + Math.sin(u * 34 + 1.7) * .3 + Math.sin(u * 8 + .6) * .35;   // 褶子不等宽：三股叠在一起
  const mat = new THREE.MeshStandardMaterial({color: '#f2eadb', map: weave, alphaMap: weave, roughness: .92, transparent: true, opacity: .62, side: THREE.DoubleSide, emissive: new THREE.Color('#fff4e6'), emissiveIntensity: .08, depthWrite: false});
  mat.onBeforeCompile = sh => {

      transformed.z += (sin(u * 21.0) * .7 + sin(u * 34.0 + 1.7) * .3 + sin(u * 8.0 + .6) * .35) * .2 * (1.0 - .3 * v);
      float tg = uT - 13.2 * .035 - v * .5, gst = sin(tg * .9) * .62 + sin(tg * 1.53 + 1.1) * .28 + sin(tg * 2.9 + .4) * .1;   // 和窗外柳条同一阵风
      float sw = v * v, ka = (.35 + .65 * min(uAmp / .165, 2.8)) * (.55 + .45 * gst);   // 风大了下摆鼓得更高，往屋里扬；一阵风过来时一起鼓
      transformed.z += sw * ka * (.8 + .5 * sin(uT * .9 + u * 2.0)) * (.55 + .45 * sin(uT * 1.6 + v * 3.0 + u * 4.0));
      transformed.x -= sw * ka * (.5 + .4 * sin(uT * 1.2 + v * 2.5));

      float hem = step(vCu.y, .022) + step(1. - .012, vCu.y) * .6 + (step(vCu.x, .014) + step(1. - .014, vCu.x)) * .7;   // 底边、顶边、两侧折边：两层纱
      float seam = smoothstep(.0, .004, abs(vCu.y - .022)) ;                                                             // 贴边的那道缝线

const SKYU = {top: {value: new THREE.Color()}, mid: {value: new THREE.Color()}, bot: {value: new THREE.Color()}, sunDir: {value: new THREE.Vector3(0, 1, 0)}, sunCol: {value: new THREE.Color()},
  glow: {value: new THREE.Color()}, moonDir: {value: new THREE.Vector3(-.04, .122, -.99).normalize()}, moonK: {value: 0}, starK: {value: 0}, phase: {value: Math.PI}, uT: {value: 0}, cover: {value: 0}};
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: SKYU,
  vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: `uniform vec3 top, mid, bot, sunCol, sunDir, glow, moonDir; uniform float moonK, starK, phase, uT, cover; varying vec3 vD;
    float hs(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f); return mix(mix(hs(i), hs(i + vec2(1, 0)), f.x), mix(hs(i + vec2(0, 1)), hs(i + vec2(1, 1)), f.x), f.y); }
    void main(){ vec3 d = normalize(vD); float h = d.y;
      vec3 c = h > 0. ? mix(mid, top, pow(clamp(h * 1.6, 0., 1.), .7)) : mix(mid, bot, clamp(-h * 5., 0., 1.));
      vec3 sd = normalize(sunDir); float s = max(dot(d, sd), 0.);
      float az = max(dot(normalize(d.xz + 1e-5), normalize(sd.xz + 1e-5)), 0.);
      c += glow * (pow(az, 4.) * exp(-abs(h) * 6.) * .9 + pow(s, 6.) * .5);                       /* 太阳那一边的海平线暖起来 */
      c += sunCol * (pow(s, 1400.) * 7. + pow(s, 60.) * .5 + pow(s, 12.) * .12) * (1. - cover);   /* 日轮和它周围一圈光 */
      if (starK > .01 && h > .0){
        vec2 sp = vec2(atan(d.z, d.x) * 130., h * 130.), ci = floor(sp), cf = fract(sp) - .5; float r = hs(ci);
        if (r > .982){ vec2 o = vec2(hs(ci + 3.1), hs(ci + 7.7)) - .5; float b = .35 + .65 * pow(hs(ci + 1.3), 3.);
          float tw = .7 + .3 * sin(uT * (1.3 + 3. * hs(ci + 9.2)) + r * 60.);
          c += mix(vec3(1., .92, .8), vec3(.8, .88, 1.), hs(ci + 4.4)) * smoothstep(.16, .02, length(cf - o * .6)) * b * tw * starK * smoothstep(.0, .2, h) * (1. - cover); }
      }
      if (moonK > .01){

        c += vec3(.72, .78, .9) * (pow(max(mc, 0.), 900.) * .55 + pow(max(mc, 0.), 60.) * .14 + pow(max(mc, 0.), 8.) * .04) * moonK * (1. - .6 * cover);   /* 月晕 */
        float R = .02; vec3 rt = normalize(cross(md, vec3(0., 1., 0.))), up = cross(rt, md); vec2 uv = vec2(dot(d, rt), dot(d, up)) / R; float rr = length(uv);
        if (mc > 0. && rr < 1.){
          vec3 nm = vec3(uv, sqrt(1. - rr * rr)), ld = vec3(sin(phase), 0., -cos(phase));
          float lit = smoothstep(-.05, .08, dot(nm, ld));

          c = mix(c, mcol, smoothstep(1., .93, rr) * moonK * (1. - .85 * cover));

      gl_FragColor = vec4(c, 1.); }`
}));

  const pr = want ? Math.min(window.devicePixelRatio || 1, 2.6) : (lowQ ? 1 : DPR);
  renderer.setPixelRatio(pr); composer.setPixelRatio(pr); resize();
};
const goLowQ = () => { lowQ = true; gtao.enabled = false; renderer.setPixelRatio(1); composer.setPixelRatio(1); resize(); sun.shadow.mapSize.set(1024, 1024); sun.shadow.map?.dispose(); sun.shadow.map = null; };   // 设备跑不动时降一档
function frame(){
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  const k = instant ? 1 : 1 - Math.exp(-dt * 2.2);
  if (!hold) viewT += ((view) - viewT) * (instant ? 1 : 1 - Math.exp(-dt * 1.6));
  if (Math.abs(view - viewT) < .0005) viewT = view;
  if (!down && panV){ panTo = Math.max(-1, Math.min(1, panTo + panV * dt)); panV *= Math.exp(-dt * 5); if (Math.abs(panV) < .01) panV = 0; }
  pan += (panTo - pan) * (instant ? 1 : 1 - Math.exp(-dt * 7));
  focusT += ((focusKey ? 1 : 0) - focusT) * (instant ? 1 : 1 - Math.exp(-dt * 2.4)); if (Math.abs(focusT - (focusKey ? 1 : 0)) < .001) focusT = focusKey ? 1 : 0;
  stepCandle(dt, t); stepPhone(dt); stepSteam(dt, t); stepNP(dt); stepCrisp();
  stepTod(instant ? 1 : 1 - Math.exp(-dt * 1.5));
  if (tod === 'auto' && t - AUTO.at > 1){ AUTO.at = t; const nm = AUTO.name; autoTod(); if (nm !== AUTO.name) syncWxUI(); }   // 跟着钟点：一秒算一次
  stepWeather(dt, t); SKYU.uT.value = t; LIFE.step(dt, t);
  WIND.uT.value += dt * (.55 + 1.8 * WX.windS); SEA.uT.value = window.__seaT ?? (t % 1000);
  placeCamera(viewT);
  // 风铃、鸟、电车、CD
  stepFurin(t, dt);
  for (const c of clouds){ c.position.x += dt * (1 + 14 * WX.windS); if (c.position.x > 700) c.position.x -= 1400; }
  FALL.step(dt, t);
  PET.tick(dt); QS.step(dt, t); cardShadow.update(cur.sunDir, Math.max(0, Math.min(1, (cur.sunI - .4) / 3.2)) * .85);
  placeTags();
  glassSync(); grade.uniforms.time.value = t % 10; grade.uniforms.dark.value = cur.dark;
  composer.render();
  instant = false;
  // 手机跑不动就降一档：分辨率降到 1，影子图减半
  if (!lowQ && t > 2){ ftAcc += dt; ftN++; if (ftN >= 90){ if (ftAcc / ftN > 1 / 34) goLowQ(); ftAcc = 0; ftN = 0; } }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* 自查截图用 */
/* ── 给前后端接的口：页面外面拿到数据以后调这几个就行 ──
   fuyue.setNotes(['…','…','…'])                 留言板上的三张便签（最近三条碎碎念）
   fuyue.setNowPlaying({title, artist, dur, pos, playing, lyrics: [{t: 秒, text}]})   电脑上一起听的歌
   fuyue.setBookPage({left, right, title, pages: ['214', '215']})                   摊开的书正翻在哪一页
   fuyue.setSpace('最新一条动态里的一句话')                                          风铃纸笺换字、荡一下 */
window.fuyue = {
  setSpace(text){ const t = furin.userData.tz; furinPaint(t.image.getContext('2d'), 128, 512, text || ''); t.needsUpdate = true; swingFurin(.8); },   // 空间有新动态：纸笺换成那一句，风铃荡一下
  setNotes(list){ (list || []).slice(0, NOTE_TEX.length).forEach((t, i) => NOTE_TEX[i].userData.set(t)); },
  setNowPlaying(o){ Object.assign(NP, o || {}); NP.acc = 1; },
  /* 天色、天气接后端：
     fuyue.setClock('2026-10-03T19:30:00')   用这个时间来算天色（不传就用手机自己的时间）；fuyue.setClock(null) 回到手机时间
     fuyue.setAuto(true/false)               天色跟不跟着时间走
     fuyue.setWeather({wind: 0~1, rain: 0~1, snow: 0~1, thunder: 0~1})   或者直接给天气预报的数：{windMs: 米/秒, rainMmH: 毫米/小时, snowCmH: 厘米/小时, thunder: true}
     fuyue.setFootprints(true/false)         沙滩上那串脚印（比如他出门了才有） */
  setClock(d){ AUTO.date = d || null; if (tod === 'auto') autoTod(); },
  setAuto(on){ AUTO.on = !!on; if (on){ autoTod(); tod = 'auto'; } else if (tod === 'auto') tod = 'day'; syncWxUI(); },
  setWeather(o = {}){ const c = v => Math.max(0, Math.min(1, v));
    if (o.windMs !== undefined) o.wind = c(o.windMs / 17); if (o.rainMmH !== undefined) o.rain = c(Math.sqrt(o.rainMmH / 20)); if (o.snowCmH !== undefined) o.snow = c(Math.sqrt(o.snowCmH / 4)); if (typeof o.thunder === 'boolean') o.thunder = o.thunder ? .7 : 0;
    for (const k of ['wind', 'rain', 'snow', 'thunder']) if (typeof o[k] === 'number') WXS[k] = c(o[k]); WXS.autoSnow = false; syncWxUI(); },
  setFootprints(on){ SANDU.steps.value = on ? 1 : 0; },
  setBookPage(o){ const {left = '', right = '', title = '', pages = ['', '']} = o || {}; BOOK_PAGES[0].userData.set(left, '', pages[0]); BOOK_PAGES[1].userData.set(right, title, pages[1]); }
};
window.__fy = {
  set(o){ if (o.season) setSeason(o.season); if (o.tod){ AUTO.on = o.tod === 'auto'; if (o.date) AUTO.date = o.date; if (AUTO.on) autoTod(); tod = o.tod; } if (o.wx){ Object.assign(WXS, o.wx); wxJump(); } syncWxUI(); if (o.view !== undefined){ setView(o.view); viewT = o.view; } if (o.pan !== undefined){ pan = panTo = o.pan; } if (o.focus !== undefined){ if (o.focus) focus(o.focus); else unfocus(); focusT = o.focus ? 1 : 0; phoneFlip.v = phoneFlip.to; phoneFlip.t = 1; } if (o.vt !== undefined){ viewT = o.vt; hold = true; } else hold = false; instant = true; },
  obj(k){ return BYKEY[k].obj; },
  spin(){ QS.spin(); },
  qs(){ return {t: QS.t, rz: qsSpin.rotation.z, y: qsSpin.position.y}; },
  state(){ return {flip: phoneFlip.v, flipTo: phoneFlip.to, focusKey, focusT, view, viewT, pan, body: document.body.className, card: CARD.className}; },
  tags(){ return TAGS.map(t => t.key + ':' + (t.el.classList.contains('hide') ? '-' : '+') + ':' + t.el.style.transform); },
  lowq(){ goLowQ(); },
  tapKey(k){ instant = false; focus(k); },
  swing(){ swingFurin(); },
  tapAt(x, y){ tap(x, y); return {focusKey, view}; },
  warm(sec){ for (let i = 0; i < sec * 30; i++) FALL.step(1 / 30, i / 30); },
  topMap(){ renderTop(); const b = new Uint8Array(512 * 288 * 4); renderer.readRenderTargetPixels(topRT, 0, 0, 512, 288, b); const c = document.createElement('canvas'); c.width = 512; c.height = 288; const x = c.getContext('2d'), im = x.createImageData(512, 288); for (let y = 0; y < 288; y++) for (let i = 0; i < 512; i++){ const s = ((287 - y) * 512 + i) * 4, d = (y * 512 + i) * 4, v = b[s]; im.data[d] = im.data[d + 1] = im.data[d + 2] = v; im.data[d + 3] = 255; } x.putImageData(im, 0, 0); return c.toDataURL(); },
  camera, scene, THREE, tips: tips.length + '/' + WL.n, segs: segs.length, tipList: tips, segList: segs
};
